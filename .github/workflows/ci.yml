name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Install dev dependencies (for tests)
        run: npm install --include=dev
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install redis client
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
      - name: Wait for Postgres and Redis
        run: |
          echo "Waiting for Postgres and Redis to be ready..."
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U postgres && redis-cli -h localhost -p 6379 ping | grep -q PONG && break || sleep 1
          done
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy || true
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run unit tests with coverage
        run: npx vitest run --coverage

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd='pg_isready -U postgres' --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd='redis-cli ping' --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Wait for services
        run: |
          echo "Waiting for Postgres and Redis to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run integration tests
        run: npx vitest run tests/integration --config vitest.config.ts
