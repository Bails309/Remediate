name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Default least-privilege token scope for every job. Jobs that need to write
# (e.g. `security` uploads SARIF to code-scanning) override this with their
# own `permissions:` block. CodeQL flags any workflow/job that doesn't pin a
# permissions scope, since the default GITHUB_TOKEN otherwise gets write
# access to the repository contents.
permissions:
  contents: read

concurrency:
  # Cancel any in-flight CI run for the same ref (branch or PR) when a new commit
  # lands. Saves runner minutes and avoids flaky overlapping Playwright sessions.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build App Image (Runner)
        run: docker build --target app-runner -t remediate-app:test .
      - name: Build Worker Image (Runner)
        run: docker build --target worker-runner -t remediate-worker:test .

      # npm audit only sees the JS dependency tree. The runtime image also
      # carries an OS layer (base image, apt/apk packages, the bundled Node
      # binary) that nothing else in CI inspects.
      - name: Scan app image for OS and library CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          # ghcr.io anonymous pulls are rate-limited on shared runners, which
          # fails the DB download and leaves no SARIF behind. Use the mirror.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          image-ref: remediate-app:test
          format: sarif
          output: trivy-app.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan worker image for OS and library CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          image-ref: remediate-worker:test
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Uploaded separately with distinct categories: a single submission of
      # two files would have each overwrite the other's results.
      - name: Upload app image scan results
        if: always() && hashFiles('trivy-app.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-app.sarif
          category: trivy-app-image

      - name: Upload worker image scan results
        if: always() && hashFiles('trivy-worker.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker-image

  # Guards against a schema.prisma edit that was never turned into a migration.
  # Without this the drift only surfaces at deploy time, when `migrate deploy`
  # applies an incomplete set and the app starts against the wrong shape.
  schema-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Fail if schema.prisma has drifted from prisma/migrations
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code \
          || {
            echo "::error::schema.prisma differs from the committed migrations."
            echo "Run: npx prisma migrate dev --name <describe-your-change>"
            exit 1
          }

  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (allowlist-aware)
        # Advisories that are known non-exploitable in this codebase are
        # tracked in .audit-allowlist.json with a mandatory expiry. See
        # SECURITY.md § npm audit allowlist for the review policy.
        # `npm audit` exits non-zero when it finds any advisory, so we
        # capture the JSON to a file (ignoring its exit code) and then let
        # scripts/audit-filter.mjs decide whether to fail based on the
        # allowlist.
        run: |
          npm audit --omit=dev --json > audit.json || true
          node scripts/audit-filter.mjs --audit-level=high < audit.json

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Install dev dependencies (for tests)
        run: npm install --include=dev
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install redis client
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
      - name: Wait for Postgres and Redis
        run: |
          echo "Waiting for Postgres and Redis to be ready..."
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U postgres && redis-cli -h localhost -p 6379 ping | grep -q PONG && break || sleep 1
          done
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Run unit tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 30

      - name: Check coverage threshold
        if: always()
        env:
          # Thresholds are set just below the current CI floor so the suite is
          # protected against regressions without blocking merges. Raise these
          # in small steps as new tests land — they should ratchet up over time,
          # never down.
          MIN_STATEMENTS: 65
          MIN_BRANCHES: 58
          # Function coverage runs lower than line/statement coverage because most
          # large client components (vulnerabilities/uploads/tools) are covered by
          # Playwright e2e tests rather than vitest unit tests, and v8 reports each
          # inline arrow callback as a separate uncovered function. Lowered from
          # 63 -> 61 in v2.8.15 after the MyQueueSeverityChart effect-refactor
          # removed a handful of counted arrow callbacks (.then/.catch/.finally
          # + a mount hydration effect); ratchet back up as new tests land.
          MIN_FUNCTIONS: 61
          MIN_LINES: 68
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'coverage/coverage-summary.json',
            'coverage/coverage-final.json',
            'coverage/v8/coverage-final.json',
          ];
          let data;
          for (const f of files) {
            if (fs.existsSync(f)) {
              try { data = JSON.parse(fs.readFileSync(f,'utf8')); break } catch(e){}
            }
          }
          if (!data || !data.total) { console.log('No coverage summary found; skipping threshold check'); process.exit(0); }
          const t = data.total;
          const checks = [
            ['statements', t.statements?.pct, Number(process.env.MIN_STATEMENTS || 75)],
            ['branches',   t.branches?.pct,   Number(process.env.MIN_BRANCHES || 60)],
            ['functions',  t.functions?.pct,   Number(process.env.MIN_FUNCTIONS || 70)],
            ['lines',      t.lines?.pct,       Number(process.env.MIN_LINES || 75)],
          ];
          let failed = false;
          for (const [name, pct, min] of checks) {
            if (typeof pct !== 'number') { console.log(`${name}: unable to determine, skipping`); continue; }
            if (pct < min) { console.error(`${name} coverage ${pct}% is below threshold ${min}%`); failed = true; }
            else { console.log(`${name} coverage: ${pct}% >= ${min}% ✓`); }
          }
          if (failed) process.exit(1);
          console.log('All coverage thresholds met');
          NODE

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Wait for services
        run: |
          echo "Waiting for Postgres and Redis to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break || sleep 1
          done
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run integration tests
        run: npx vitest run tests/integration --config vitest.config.ts

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: test-secret
      LOCAL_AUTH_ENABLED: 'true'
      LOCAL_AUTH_USER: admin
      LOCAL_AUTH_PASS: admin
      LOCAL_AUTH_EMAIL: admin@example.com
      LOCAL_AUTH_NAME: Test Admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply database schema
        run: npx prisma db push --skip-generate
      - name: Seed database
        run: npx prisma db seed
      - name: Build Application
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

