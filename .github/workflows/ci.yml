name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build App Image (Runner)
        run: docker build --target app-runner -t remediate-app:test .
      - name: Build Worker Image (Runner)
        run: docker build --target worker-runner -t remediate-worker:test .

  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret' }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Install dev dependencies (for tests)
        run: npm install --include=dev
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install redis client
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
      - name: Wait for Postgres and Redis
        run: |
          echo "Waiting for Postgres and Redis to be ready..."
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U postgres && redis-cli -h localhost -p 6379 ping | grep -q PONG && break || sleep 1
          done
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy || true
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Run unit tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 30

      - name: Check coverage threshold
        if: always()
        env:
          MIN_STATEMENTS: 75
          MIN_BRANCHES: 60
          # Function coverage runs lower than line/statement coverage because most
          # large client components (vulnerabilities/uploads/tools) are covered by
          # Playwright e2e tests rather than vitest unit tests, and v8 reports each
          # inline arrow callback as a separate uncovered function.
          MIN_FUNCTIONS: 65
          MIN_LINES: 75
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'coverage/coverage-summary.json',
            'coverage/coverage-final.json',
            'coverage/v8/coverage-final.json',
          ];
          let data;
          for (const f of files) {
            if (fs.existsSync(f)) {
              try { data = JSON.parse(fs.readFileSync(f,'utf8')); break } catch(e){}
            }
          }
          if (!data || !data.total) { console.log('No coverage summary found; skipping threshold check'); process.exit(0); }
          const t = data.total;
          const checks = [
            ['statements', t.statements?.pct, Number(process.env.MIN_STATEMENTS || 75)],
            ['branches',   t.branches?.pct,   Number(process.env.MIN_BRANCHES || 60)],
            ['functions',  t.functions?.pct,   Number(process.env.MIN_FUNCTIONS || 70)],
            ['lines',      t.lines?.pct,       Number(process.env.MIN_LINES || 75)],
          ];
          let failed = false;
          for (const [name, pct, min] of checks) {
            if (typeof pct !== 'number') { console.log(`${name}: unable to determine, skipping`); continue; }
            if (pct < min) { console.error(`${name} coverage ${pct}% is below threshold ${min}%`); failed = true; }
            else { console.log(`${name} coverage: ${pct}% >= ${min}% ✓`); }
          }
          if (failed) process.exit(1);
          console.log('All coverage thresholds met');
          NODE

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Wait for services
        run: |
          echo "Waiting for Postgres and Redis to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break || sleep 1
          done
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run integration tests
        run: npx vitest run tests/integration --config vitest.config.ts

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remediate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remediate
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: test-secret
      LOCAL_AUTH_ENABLED: 'true'
      LOCAL_AUTH_USER: admin
      LOCAL_AUTH_PASS: admin
      LOCAL_AUTH_EMAIL: admin@example.com
      LOCAL_AUTH_NAME: Test Admin
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply database schema
        run: npx prisma db push --skip-generate
      - name: Seed database
        run: npx prisma db seed
      - name: Build Application
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

