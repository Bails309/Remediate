name: Dependency Audit

# `actions/dependency-review-action` requires GitHub Advanced Security on private
# repos, which is not available on this plan. This workflow uses `npm audit` to
# achieve the same outcome — failing PRs that introduce high/critical advisories
# in npm dependencies — without requiring GHAS.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: dep-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: npm audit (high severity gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (no scripts, no audit on install)
        # --ignore-scripts avoids running arbitrary lifecycle scripts of incoming
        # deps before we've audited them. --no-audit suppresses the duplicate
        # audit call npm runs by default during install.
        run: npm ci --ignore-scripts --no-audit

      - name: Audit production dependencies (allowlist-aware)
        # `npm audit` exits non-zero when any advisory at or above
        # --audit-level=high is found. We scope to production deps so dev-only
        # advisories (e.g. test tooling) don't block merges. The output is
        # piped through scripts/audit-filter.mjs which suppresses advisories
        # listed in .audit-allowlist.json with a mandatory expiry — see
        # SECURITY.md § npm audit allowlist. We capture JSON to a file
        # (ignoring npm audit's exit code) so pipefail doesn't fail before
        # the filter runs.
        run: |
          npm audit --omit=dev --json > audit.json || true
          node scripts/audit-filter.mjs --audit-level=high < audit.json

      - name: Generate full JSON audit report (informational)
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30
