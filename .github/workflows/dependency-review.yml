name: Dependency Review

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Fail the PR on any new dependency rated high or critical so we never
          # silently merge a known-vulnerable transitive bump.
          fail-on-severity: high
          # Block copyleft licences that would force source disclosure of the
          # closed-source app. Extend this list as needed.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure
