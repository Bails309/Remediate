name: Apply Database Migrations

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remediate
          POSTGRES_PASSWORD: remediate_password
          POSTGRES_DB: remediate
        options: >-
          --health-cmd="pg_isready -U remediate -d remediate"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Point at the service started above. Using the service hostname 'postgres'.
      DATABASE_URL: postgresql://remediate:remediate_password@postgres:5432/remediate?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres service
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h postgres -p 5432 -U remediate; then
              echo "Postgres is ready"; exit 0
            fi
            echo "Waiting for Postgres ($i/30)..."
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations (deploy)
        run: npx prisma migrate deploy --preview-feature

      - name: Run DB optimizations
        run: npx tsx scripts/optimize-db.ts

      - name: Success
        run: echo "Migrations and DB optimizations applied successfully"
