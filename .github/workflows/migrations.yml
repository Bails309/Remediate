name: Apply Database Migrations

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Least-privilege token: the migration job only needs to read the repo to
# check out source and run `prisma migrate deploy` against the database
# defined by AUTH_SECRET/DATABASE_URL secrets. No write to repo contents.
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remediate
          POSTGRES_PASSWORD: remediate_password
          POSTGRES_DB: remediate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432 -d remediate"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Point at the service started above via the runner's localhost port forwarding.
      DATABASE_URL: postgresql://remediate:remediate_password@localhost:5432/remediate?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install redis client
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Debug DNS / connectivity to postgres service
        run: |
          sudo apt-get install -y iputils-ping dnsutils
          echo '--- /etc/resolv.conf ---'
          cat /etc/resolv.conf || true
          echo '--- getent hosts postgres ---'
          getent hosts postgres || true
          echo '--- getent hosts localhost ---'
          getent hosts localhost || true
          echo '--- ping postgres (1) ---'
          ping -c 1 postgres || true
          echo '--- ping localhost (1) ---'
          ping -c 1 localhost || true
          echo '--- trying to resolve via dig ---'
          dig +short postgres || true
          dig +short localhost || true

      - name: Wait for Postgres service
        run: |
          # Try for up to ~5 minutes (60 attempts x 5s)
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U remediate; then
              echo "Postgres is ready"; exit 0
            fi
            echo "localhost:5432 - no response"
            echo "Waiting for Postgres ($i/60)..."
            sleep 5
          done
          echo "Postgres did not become ready" >&2
          echo "=== Service list ==="
          docker ps --no-trunc || true
          echo "=== Inspect postgres container ==="
          docker inspect postgres || true
          echo "=== Recent logs (if available) ==="
          docker logs postgres --tail 200 || true
          exit 1

      - name: Wait for Redis service
        run: |
          for i in $(seq 1 60); do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is ready"; exit 0
            fi
            echo "localhost:6379 - no response"
            echo "Waiting for Redis ($i/60)..."
            sleep 2
          done
          echo "Redis did not become ready" >&2
          exit 1

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations (deploy)
        run: npx prisma migrate deploy --preview-feature

      - name: Run DB optimizations
        run: npx tsx scripts/optimize-db.ts

      - name: Success
        run: echo "Migrations and DB optimizations applied successfully"
