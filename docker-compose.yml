services:
  app:
    build:
      context: .
      target: app-runner
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://remediate:remediate_password@db:5432/remediate?schema=public
      REDIS_URL: redis://redis:6379
      PENTEST_BACKEND_URL: ${PENTEST_BACKEND_URL:-http://pentest-backend:8000}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      NODE_OPTIONS: "--max-old-space-size=4096"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - pentest_internal

  worker:
    build:
      context: .
      target: worker-runner
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://remediate:remediate_password@db:5432/remediate?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: remediate
      POSTGRES_PASSWORD: remediate_password
      POSTGRES_DB: remediate
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U remediate -d remediate" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
      - pentest_internal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  pentest-backend:
    build:
      context: ./pentest-backend
    environment:
      PENTEST_JWT_SECRET: ${PENTEST_JWT_SECRET}
      DATABASE_URL: postgresql://remediate:remediate_password@db:5432/remediate?schema=public
      TOOLS_CONFIG_PATH: /config/tools.json
      PENTEST_JWT_ISSUER: remediate
      PENTEST_JWT_AUDIENCE: pentest-backend
    volumes:
      - ./pentest-backend/config:/config
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - pentest_internal

volumes:
  db_data:
  redis_data:


networks:
  pentest_internal:
    internal: true
